<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{brand.google_fonts_url}}">
<style>
  html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden}
  body{background:{{brand.colour.bg}};color:{{brand.colour.fg}};font-family:{{brand.font_body}};padding:84px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .zone{display:inline-block;background:{{brand.colour.accent}};color:#0b1f14;font-family:{{brand.font_heading}};font-weight:800;font-size:34px;padding:14px 24px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
  h1{font-family:{{brand.font_heading}};font-size:90px;line-height:1.04;margin:40px 0 0;font-weight:800}
  .sub{font-size:40px;line-height:1.3;margin-top:30px;opacity:.92}
  .list{margin-top:36px;font-size:36px;line-height:1.5}
  .list div::before{content:"✓ ";color:{{brand.colour.accent}};font-weight:800}
  .foot{display:flex;justify-content:space-between;align-items:center}
  .brand{font-family:{{brand.font_heading}};font-weight:800;font-size:34px}
  .site{font-size:30px;opacity:.8}
</style>
</head>
<body>
  <div>
    <div class="zone">{{zone}}</div>
    <h1>{{headline}}</h1>
    <div class="sub">{{sub}}</div>
    <div class="list"><div>{{point1}}</div><div>{{point2}}</div><div>{{point3}}</div></div>
  </div>
  <div class="foot"><div class="brand">{{brand.name}}</div><div class="site">greasetrapquotes.com</div></div>
</body>
</html>
