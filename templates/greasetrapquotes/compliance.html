<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{brand.google_fonts_url}}">
<style>
  html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden}
  body{background:{{brand.colour.accent}};color:#0b1f14;font-family:{{brand.font_body}};padding:84px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
  .stamp{font-family:{{brand.font_heading}};font-weight:800;font-size:40px;border:6px solid #0b1f14;display:inline-block;padding:14px 26px;transform:rotate(-3deg);text-transform:uppercase;letter-spacing:.06em}
  h1{font-family:{{brand.font_heading}};font-size:92px;line-height:1.04;margin:44px 0 0;font-weight:800}
  .sub{font-size:40px;line-height:1.3;margin-top:30px}
  .brand{position:absolute;bottom:60px;left:84px;font-family:{{brand.font_heading}};font-weight:800;font-size:32px}
  .site{position:absolute;bottom:60px;right:84px;font-size:30px}
</style>
</head>
<body>
  <div><span class="stamp">{{stamp}}</span></div>
  <h1>{{headline}}</h1>
  <div class="sub">{{sub}}</div>
  <div class="brand">{{brand.name}}</div>
  <div class="site">greasetrapquotes.com</div>
</body>
</html>
