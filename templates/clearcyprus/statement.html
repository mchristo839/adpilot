<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden}
  body{background:{{brand.colour.ink}};color:{{brand.colour.paper}};font-family:"IBM Plex Sans",sans-serif;padding:84px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:28px;border:2px solid {{brand.colour.yellow}};color:{{brand.colour.yellow}};padding:10px 18px}
  h1{font-size:96px;line-height:1.04;margin:40px 0 0;font-weight:700;letter-spacing:-.015em}
  .sub{font-size:40px;line-height:1.35;margin-top:36px;opacity:.9;max-width:90%}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .brand{font-weight:700;font-size:34px}
  .cta{background:{{brand.colour.rust}};color:{{brand.colour.paper}};font-weight:700;font-size:34px;padding:20px 32px}
</style>
</head>
<body>
  <div>
    <div class="tag">{{tag}}</div>
    <h1>{{headline}}</h1>
    <div class="sub">{{sub}}</div>
  </div>
  <div class="foot"><div class="brand">{{brand.name}}</div><div class="cta">{{cta}}</div></div>
</body>
</html>
