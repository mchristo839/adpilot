<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{brand.google_fonts_url}}">
<style>
  html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden}
  body{background:{{brand.colour.bg}};color:{{brand.colour.fg}};font-family:{{brand.font_body}};display:flex;flex-direction:column;justify-content:center;padding:84px;box-sizing:border-box}
  .phone{display:flex;align-items:center;gap:24px;background:#fff;color:#111;border-radius:28px;padding:30px 36px;box-shadow:0 20px 50px rgba(0,0,0,.35);margin-bottom:56px}
  .dot{width:26px;height:26px;border-radius:50%;background:#E53935}
  .phone .t{font-size:34px;font-weight:600}
  .phone .m{font-size:28px;opacity:.6}
  h1{font-family:{{brand.font_heading}};font-size:88px;line-height:1.04;margin:0}
  .sub{font-size:40px;line-height:1.3;margin-top:30px;opacity:.92}
  .cta{margin-top:44px;display:inline-block;background:{{brand.colour.accent}};color:#111;font-weight:700;font-size:38px;padding:22px 40px;border-radius:14px}
  .brand{position:absolute;bottom:60px;left:84px;font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
</style>
</head>
<body>
  <div class="phone"><div class="dot"></div><div><div class="t">Missed call</div><div class="m">{{caller}}</div></div></div>
  <h1>{{headline}}</h1>
  <div class="sub">{{sub}}</div>
  <div><span class="cta">{{cta}}</span></div>
  <div class="brand">{{brand.name}}</div>
</body>
</html>
