<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{brand.google_fonts_url}}">
<style>
  html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden}
  body{background:{{brand.colour.accent}};color:#111;font-family:{{brand.font_body}};display:flex;flex-direction:column;justify-content:center;padding:84px;box-sizing:border-box}
  .stat{font-family:{{brand.font_heading}};font-size:220px;font-weight:800;line-height:1;letter-spacing:-.03em}
  h1{font-family:{{brand.font_heading}};font-size:72px;line-height:1.08;margin:24px 0 0}
  .sub{font-size:38px;line-height:1.3;margin-top:28px;opacity:.85}
  .brand{position:absolute;top:60px;left:84px;background:{{brand.colour.bg}};color:#fff;font-weight:700;font-size:28px;padding:12px 20px;border-radius:10px;letter-spacing:.05em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="brand">{{brand.name}}</div>
  <div class="stat">{{stat}}</div>
  <h1>{{headline}}</h1>
  <div class="sub">{{sub}}</div>
</body>
</html>
