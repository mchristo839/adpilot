<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="{{brand.google_fonts_url}}">
<style>
  html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden}
  body{background:{{brand.colour.bg}};color:{{brand.colour.fg}};font-family:{{brand.font_body}};display:flex;flex-direction:column;justify-content:space-between;padding:80px;box-sizing:border-box}
  .brand{font-family:{{brand.font_heading}};font-weight:700;font-size:34px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
  h1{font-family:{{brand.font_heading}};font-weight:700;font-size:92px;line-height:1.04;margin:0;letter-spacing:-.01em}
  .sub{font-size:40px;line-height:1.3;margin-top:36px;opacity:.9}
  .cta{display:inline-block;margin-top:40px;background:{{brand.colour.accent}};color:{{brand.colour.bg}};font-family:{{brand.font_heading}};font-weight:700;font-size:38px;padding:22px 40px;border-radius:12px}
  .bar{height:14px;background:{{brand.colour.accent}};width:220px}
</style>
</head>
<body>
  <div class="brand">{{brand.name}}</div>
  <div>
    <div class="bar"></div>
    <h1 style="margin-top:32px">{{headline}}</h1>
    <div class="sub">{{sub}}</div>
    <div class="cta">{{cta}}</div>
  </div>
  <div style="font-size:28px;opacity:.7">{{proof}}</div>
</body>
</html>
